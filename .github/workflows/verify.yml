name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_DATABASE: devprocess_ci
          MYSQL_USER: devprocess_ci
          MYSQL_PASSWORD: ci_test_only_password
          MYSQL_ROOT_PASSWORD: ci_test_only_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DPM_IT_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/devprocess_ci?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
      DPM_IT_MYSQL_USERNAME: devprocess_ci
      DPM_IT_MYSQL_PASSWORD: ci_test_only_password
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 8 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            runner/node-runner/package-lock.json
            runner/browser-runner/package-lock.json

      - name: Validate Git source release hygiene (no secrets, no runtime files)
        run: |
          node --test scripts/release-worktree-audit.test.mjs
          node scripts/audit-release-worktree.mjs --strict

      - name: Audit JavaScript lockfiles
        run: |
          npm audit --audit-level=moderate --package-lock-only --prefix frontend
          npm audit --audit-level=moderate --package-lock-only --prefix runner/node-runner
          npm audit --audit-level=moderate --package-lock-only --prefix runner/browser-runner

      - name: Install frontend dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix frontend

      - name: Verify frontend imports and build static assets
        run: npm run --prefix frontend build

      - name: Unit tests and Spring Boot packaging
        run: mvn -B -ntp -f backend/pom.xml clean verify

      - name: MySQL 5.7 InnoDB integration tests
        run: mvn -B -ntp -f backend/pom.xml '-Dtest=RunnerLeaseMySqlIT' test

      - name: HTTP Runner tests
        run: node --test runner/http-runner/http-dsl.test.mjs

      - name: Install Node Runner dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix runner/node-runner

      - name: QuickJS Node Runner tests
        run: npm test --prefix runner/node-runner

      - name: Install Browser Runner dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix runner/browser-runner

      - name: Browser Runner DSL policy tests
        run: npm test --prefix runner/browser-runner
